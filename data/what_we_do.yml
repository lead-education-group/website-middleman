header_description: >-
  We believe that education is a primary means for the future success of individuals, societies, and nations.


  Our approach can be outlined by looking at an international school that we established in Sfax, Tunisia.
section_one_title: A blueprint to follow
section_one_body: >-
  The International Academy of Sfax (IAS), Tunisia is a model of the type of school LEAD Education plans to start in other cities.


  This multi-lingual school, English, French and Arabic, prepares students for today’s world where critical thinking skills, and a broad worldview are essential to enrollment in a top university and success.


  English is the primary language of business, education and the Internet throughout the world. All the teachers at IAS who teach in English are native English speakers. Students learn to speak English fluently and without an accent.
section_two_title: Principled, forward-looking, accesible.
section_two_body: >-
  IAS is a “values-based school.” Students learn to respect people with other cultural backgrounds, practices and beliefs. Integrity and having strong moral principles are fostered, encouraged and modeled by the school staff. Discipline is maintained in classrooms to insure a safe learning environment for all students.


  Students learn how to use modern technologies beginning in pre-school. Video conferencing allows students to learn online and to connect with sister schools in the United States.


  Compared with other international schools, IAS is very affordable.
learn_more_prompt: To learn more about the International Academy of Sfax, please go to the school’s website.
