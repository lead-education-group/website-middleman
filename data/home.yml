header: Establishing international schools of distinction for future success.
header_description: The most reliable pathway to success, in an interconnected
  world, is an international education.
challenge_title: Education for an interconnected world
challenge_body: >-
  The COVID 19 virus graphically demonstrates how interconnected everyone is on
  the planet. What happens in one country quickly affects those in other
  countries. Economic conditions in one part of the world influence prices
  elsewhere.


  In a world such as this, education geared to only one language and culture is greatly inadequate. Companies and universities seek people with a broad worldview that can best be fostered in an international school setting.
opportunity_title: Schools for future success
opportunity_body: >-
  LEAD Education seeks to meet this challenge by starting multi-lingual,
  international schools in cities where such educational opportunities do not
  currently exist.


  These “schools of distinction” prepare students for a bright future by offering them a truly international educational experience.
approach_title: Three central elements combine to form a “school of distinction.”
approach_element_one_title: Quality Educators
approach_element_one_body: >-
  Educators are credentialed teachers who are prepared to teach at a given grade
  level, committed to each student’s learning and development and enthusiastic
  about teaching.


  Most teachers also spend one year studying the local language and culture before they enter the classroom.  This prepares them to live and teach cross-culturally and facilitates their interactions with parents.
approach_element_two_title: Proven Curriculum
approach_element_two_body: >-
  The Common Core Curriculum is used in 46 of the 50 states in America. This
  curriculum is a set of standards that students reach in creative ways.


  Rather than simply memorize facts, Common Core teaches students to analyze situations and solve problems thus preparing them for university studies and life itself.
approach_element_three_title: Adaptation to Local Culture and Languages
approach_element_three_body: >-
  Local cultures and languages are highly respected. Although education is
  international in scope and English serves as the primary language of
  instruction, much appreciation is devoted to the local milieu, languages,
  holidays and customs.


  Students learn to value their own cultural heritage as well as respect the cultural backgrounds of others.
