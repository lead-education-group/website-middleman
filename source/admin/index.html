<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEAD Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Include the script that builds the page and powers Netlify CMS -->
  <script src="https://unpkg.com/netlify-cms@^2.4.0/dist/netlify-cms.js"></script>


  <!-- Google Analytics nav item -->
  <style>
    .analytics-link {
      cursor: pointer;
      color: rgb(123, 130, 144);
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      display: inline-flex;
      -webkit-box-align: center;
      align-items: center;
      border-width: 0px;
      border-style: initial;
      border-color: initial;
      border-image: initial;
      border-radius: 5px;
      background: none;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 500;
    }

    .analytics-link:hover {
      color: rgb(58, 105, 199);
    }

    .analytics-link span {
      display: inline-block;
      line-height: 16px;
      width: 22px;
      height: 24px;
      font-size: 26px;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded",function(){
      var navs = document.getElementsByTagName('nav');

      if (navs) {
        var list = navs[0].getElementsByTagName('ul')[0];

        var analyticsItem = '<a class="analytics-link" href="https://analytics.google.com/analytics/web/?authuser=0#/report-home/a100723444w229134551p215942090">Analytics</a>'

        list.insertAdjacentHTML('beforeend', analyticsItem);
      }
    });
  </script>
</body>
</html>
